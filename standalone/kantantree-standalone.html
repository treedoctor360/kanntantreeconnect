<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2f6b4f" />
<title>かんたん樹木登録（単一ファイル版）</title>
<!--
  かんたん樹木登録 — 単一HTMLファイル版
  ------------------------------------------------------------------
  庁内など「外部のライブラリを読み込めない」環境で使うための版。
  このファイル1つだけで動く（インターネット接続・インストール・ビルド不要）。

  本体（React版）との違い
    - 外部ライブラリを使わない（React・Dexie・Leaflet を使わず素のJavaScriptで書き直した）
    - スプレッドシート連携（GAS同期）は入っていない
    - GPS（現在地の取得）・地図タブは入っていない
    - 保存先は端末内のブラウザDB（IndexedDB。使えない環境では localStorage）
    - 本体とデータをやり取りするときは、設定タブの JSON 書き出し／読み込みを使う
      （緯度・経度は入力できないが、読み込んだ値はそのまま保持して書き出す）

  項目の定義・採番の規則・紙の調査票は本体（src/lib/inspection.js ほか）と同じ内容。
  © 2026 Koh Kitsukawa. All rights reserved.
-->
<style>
/* かんたん樹木登録 — 現場で片手で触るので、押す所は大きく、余計な装飾は入れない */

:root {
  --green: #2f6b4f;
  --green-dark: #24523d;
  --bg: #f6f7f5;
  --card: #ffffff;
  --line: #d9ddd7;
  --text: #1d211e;
  --muted: #6b7269;
  --danger: #b3261e;
  --warn: #8a6d00;
  --tabbar-h: 56px;
  --copyright-h: 30px;
}

* { box-sizing: border-box; }

html, body, #root { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  /* iOSはアドレスバーの伸縮で 100vh が実際の表示領域とずれる。
     dvh（動的ビューポート高さ）が使える端末ではそちらを優先する。 */
  height: 100dvh;
}

/* --- 上部バー --- */
.appbar {
  background: var(--green);
  color: #fff;
  padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.appbar h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.appbar-sub {
  font-size: 12px;
  font-weight: 400;
  background: rgba(255, 255, 255, 0.22);
  padding: 1px 8px;
  border-radius: 999px;
}
.appbar-note {
  flex: 0 0 auto;
  font-size: 11px;
  opacity: 0.85;
  white-space: nowrap;
}

/* --- 本体 --- */
.main {
  flex: 1 1 auto;
  overflow-y: auto;
  /* 横には絶対にスクロールさせない（1箇所でも幅を超えると画面全体がずれるため） */
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.pane { padding: 12px 12px 8px; }
.pane-form { display: flex; flex-direction: column; min-height: 100%; }
.pad { padding: 16px; }

/* --- 下部タブ（登録・一覧・設定の3つ） --- */
.tabbar {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: #fff;
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbtn {
  border: 0;
  background: none;
  padding: 14px 0;
  font-size: 15px;
  color: var(--muted);
  font-weight: 600;
  font-family: inherit;
}
.tabbtn-on { color: var(--green); box-shadow: inset 0 -3px 0 var(--green); }

/* --- ブロック --- */
.block {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}
.block-title {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 700;
  color: var(--green-dark);
}

/* --- 入力 --- */
.field { display: block; margin-bottom: 8px; flex: 1 1 0; min-width: 0; }
/* 説明文・状態表示のすぐ下に入力欄が来るときは少し離す */
.status + .field, .hint + .field { margin-top: 12px; }
.field-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.field-row { display: flex; gap: 8px; }
input[type='text'],
input[type='search'],
input[type='number'],
input[type='date'],
select,
textarea {
  width: 100%;
  font-size: 16px; /* iOSで拡大されないように16px以上 */
  font-family: inherit;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
}
textarea { resize: vertical; }
.treeno-input { font-size: 22px !important; font-weight: 700; letter-spacing: 0.03em; }

/* --- 点検内容の選択欄（紙のチェックシートで〇を付ける欄にあたる） --- */
.choice-row { margin-bottom: 10px; }
.choice-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.choice-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.choice {
  flex: 1 1 0;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  font-size: 17px;
  font-family: inherit;
  font-weight: 600;
}
.choice-on { background: var(--green); border-color: var(--green); color: #fff; }
.choice-hint { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
/* 選択肢に無い値を入れる欄（樹高の「他」） */
.height-free { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.height-free input { flex: 0 0 76px; width: 76px; text-align: center; padding: 8px 4px !important; }
.height-free .choice-hint { margin-top: 0; flex: 1 1 auto; }

/* 周辺環境（道路・園路 / 電線 / 建物 をまとめた小さな囲み） */
.env-block {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  margin-bottom: 10px;
  background: #fafbfa;
}
.env-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.env-head .choice-label { margin-bottom: 0; font-size: 13px; font-weight: 600; color: var(--green-dark); }
.env-block .choice-row { margin-bottom: 6px; }
.btn-small { min-height: 32px; padding: 4px 10px; font-size: 12px; }
.btn-on { background: var(--green); border-color: var(--green); color: #fff; }
/* テープ番号は数字だけなので狭くてよい（樹木番号に幅を譲る） */
.field-tape { flex: 0 0 88px; }
.survey-summary { margin-left: 8px; font-size: 12px; }

/* --- ボタン --- */
.btn {
  font-size: 15px;
  font-family: inherit;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--green);
  background: #eef3ef;
  color: var(--green-dark);
  font-weight: 600;
  min-height: 44px;
  white-space: nowrap; /* 「選択」などが2行に折れないように */
}
.btn:disabled { opacity: 0.45; }
.btn-primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--text); font-weight: 500; }
.btn-danger { background: #fff; border-color: var(--danger); color: var(--danger); }
.btn-big { flex: 1 1 auto; font-size: 18px; min-height: 54px; }
.btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-grid {
  display: grid;
  /* minmax(0,1fr) にしないと、中身の幅（nowrapの長いラベル）で列が広がって画面をはみ出す */
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 8px;
}
/* 長いラベルのボタンは折り返してよい（はみ出すより2行の方がよい） */
.btn-grid .btn, .btn-wrap {
  white-space: normal;
  min-width: 0;
  line-height: 1.3;
  padding-left: 8px;
  padding-right: 8px;
}
.disclosure {
  border: 0;
  background: none;
  font-size: 15px;
  font-family: inherit;
  color: var(--green-dark);
  font-weight: 600;
  padding: 4px 0;
}

.link-row { display: flex; gap: 8px; margin-top: 8px; }
.link-row input { flex: 1 1 auto; min-width: 0; }
.status { margin: 8px 0 0; font-size: 13px; color: var(--green-dark); }
.status-error { color: var(--danger); }
.hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); font-weight: 400; font-size: 13px; }

/* --- 公園チップ・樹種タイル --- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  min-height: 42px;
}
.chip-on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 14px 4px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  min-height: 52px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tile-on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
.tile-sub { background: #f0f1ee; font-size: 13px; }

/* --- 写真 --- */
.thumbs { display: flex; gap: 8px; margin-top: 10px; }
.thumb {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0;
  background: #fff;
  width: 88px;
  height: 88px;
  overflow: hidden;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-x {
  position: absolute;
  top: 2px;
  right: 2px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  line-height: 22px;
  font-size: 15px;
}

/* --- 登録フッター ---
   position:fixed だと本文の上に重なって最後の項目が読めなくなる。
   sticky にすると「場所を占有したまま下端に貼り付く」ので重ならない。 */
.form-foot {
  position: sticky;
  bottom: 0;
  z-index: 5;
  margin-top: auto; /* 内容が短いときは下端に置く */
  display: flex;
  gap: 8px;
  padding: 8px 0 4px;
  background: var(--bg);
  box-shadow: 0 -8px 12px -6px rgba(0, 0, 0, 0.12);
}

/* --- 一覧 --- */
.parktabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  scrollbar-width: none;
}
.parktabs::-webkit-scrollbar { display: none; }
.parktab {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  white-space: nowrap;
}
.parktab-on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.list-tools { display: flex; gap: 8px; margin-bottom: 10px; }
.select-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 10px;
  font-size: 14px;
}
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.card {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
}
.card-on { border-color: var(--green); background: #eef3ef; }
.card-thumb {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  border-radius: 8px;
  overflow: hidden;
  background: #eceee9;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.no-photo { font-size: 10px; color: var(--muted); }
.card-body { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.card-title { font-weight: 700; font-variant-numeric: tabular-nums; }
.card-species { font-size: 14px; }
.card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.badge {
  font-size: 11px;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 5px;
  color: var(--muted);
}
.badge-warn { border-color: var(--warn); color: var(--warn); }
/* 点検で「有」だったもの（キノコ・空洞・傷・フラス ほか） */
.badge-alert { border-color: var(--danger); color: var(--danger); font-weight: 600; }
.checkbox { flex: 0 0 auto; width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 4px; }
.checkbox-on { background: var(--green); border-color: var(--green); }

/* --- 設定の一覧行 --- */
.rows { list-style: none; margin: 0 0 10px; padding: 0; }
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.row-main { display: flex; flex-direction: column; min-width: 0; }
.row-actions { display: flex; gap: 6px; }
.row-actions .btn { min-height: 38px; padding: 6px 10px; font-size: 14px; }
.subform { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }

/* --- その他 --- */
.empty { text-align: center; padding: 40px 12px; color: var(--muted); }
.empty .btn { margin-top: 10px; }
.copyright {
  flex: 0 0 auto;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 6px 0;
  background: var(--bg);
}
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + var(--copyright-h) + 84px);
  background: rgba(29, 33, 30, 0.92);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 900;
  max-width: 90vw;
  text-align: center;
}

/* ------------------------------------------------------------------
   紙の調査票のプレビュー（設定タブ → 紙の調査票）

   別タブ（window.open）で開くと、ホーム画面から起動したiPhoneには
   戻るボタンが無くアプリへ帰れない。そのためアプリの上に重ねて出し、
   [✕ 閉じる] で戻す。用紙そのものの見た目は buildSurveySheetFragment の CSS。
   ------------------------------------------------------------------ */
.sheet-viewer {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #f2f2f2;
  display: flex;
  flex-direction: column;
}
.sheet-viewer-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top)); /* iPhoneの時計に隠れないように */
  background: var(--card, #fff);
  border-bottom: 1px solid var(--line, #ddd);
}
.sheet-viewer-bar .btn { flex: 0 0 auto; width: auto; }
.sheet-viewer-hint {
  flex: 0 0 auto;
  margin: 0;
  padding: 6px 12px;
  padding-bottom: calc(6px + env(safe-area-inset-bottom));
  font-size: 11px;
  color: var(--muted);
  line-height: 1.3;
  text-align: center;
  background: var(--card, #fff);
  border-top: 1px solid var(--line, #ddd);
}
.sheet-viewer-body { flex: 1 1 auto; overflow: auto; -webkit-overflow-scrolling: touch; }
@media screen {
  /* 用紙は横281mm。「全体」のときは画面幅に収まるまで縮める。
     zoom は箱の大きさごと縮むので、余白が残らず横スクロールも消える。
     印刷には効かせない（原寸で出す）ので、この指定は @media screen の中だけに置く */
  .sheet-viewer.is-fit .sheetdoc { zoom: var(--sheet-zoom, 1); }
}

@media print {
  /* アプリ本体を隠して、用紙だけを印刷する */
  body.sheet-open #root { display: none !important; }
  body.sheet-open .sheet-viewer { position: static; display: block; background: none; }
  body.sheet-open .sheet-viewer-bar { display: none !important; }
  body.sheet-open .sheet-viewer-body { overflow: visible; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
/* ==================================================================
   かんたん樹木登録（単一ファイル版）

   本体（React版）の src/ 以下を、外部ライブラリなしの素のJavaScriptへ
   書き直したもの。中身の並びは本体のファイル構成にそろえてある。

     §1 点検項目の定義        ← src/lib/inspection.js
     §2 採番（純粋関数）      ← src/lib/treeNo.js
     §3 公園名の照合・公園CSV ← src/lib/parkName.js / parkCsv.js
     §4 写真の縮小            ← src/lib/image.js
     §5 書き出し・取込        ← src/lib/io.js
     §6 紙の調査票            ← src/lib/printSheet.js
     §7 保存層（端末内DB）    ← src/db/db.js
     §8 画面の下ごしらえ
     §9 登録タブ              ← src/components/RegisterForm ほか
     §10 一覧タブ             ← src/components/TreeList
     §11 設定タブ             ← src/components/Settings
     §12 起動                 ← src/App.jsx / main.jsx
   ================================================================== */
(function () {

/* ==================================================================
   §1 点検項目の定義（本体 src/lib/inspection.js と同じ内容）

   文言は国土交通省「都市公園の樹木の点検・診断に関する指針(案)」の
   樹木点検票(個表)に可能な限り合わせている。

   コード化の原則
     - 段階もの（順序に意味がある: 葉の茂り・活力度）は保存値を '1'〜'4' にする。
       1 = 良い/充実 側にそろえる（国交省の活力度に合わせる）。
     - 状態もの（有/無/未）は語のまま保存する。「未（見ていない）」を潰さないため。
     - 選択肢は { value, label, hint } の3点で持つ。
         value … 保存・CSVに出る値（不変にしたい）
         label … 画面のボタンに出る表示（あとで変えてよい）
         hint  … 補足説明
   ================================================================== */

/** 葉の茂り。1＝充実 側。※国交省様式に対応項目は無い（現場の目安として存置） */
var LEAF_DENSITY = [
  { value: '1', label: '濃', hint: '枝先まで密' },
  { value: '2', label: '普', hint: 'ふつう' },
  { value: '3', label: 'ま', hint: 'まばら（樹冠から空が透ける）' },
  { value: '4', label: 'ほ', hint: 'ほとんどない' },
];

/** キノコ（国交省: 樹幹・大枝・地際のキノコ）。「無」と「未」を必ず区別する */
var FUNGUS = [
  { value: '有', label: '有', hint: 'あった' },
  { value: '無', label: '無', hint: '見たが無かった' },
  { value: '未', label: '未', hint: '見ていない・下草裏が見えないなどで見えない' },
];

/** キノコ部位（複数可）。値は語のまま（根/幹/枝/枯/不） */
var FUNGUS_PART = [
  { value: '根', label: '根', hint: '根元（地際〜50cm・露出根）' },
  { value: '幹', label: '幹', hint: '根元より上の生きた幹' },
  { value: '枝', label: '枝', hint: '枝の付け根' },
  { value: '枯', label: '枯', hint: '枯枝・枯幹' },
  { value: '不', label: '不', hint: '不明' },
];

/**
 * 空洞・傷。国交省「樹幹の亀裂」と切り分けるため、ここは
 * 「穴（空洞）・樹皮の広範囲な剥離」に限定する（割れ目・裂けは trunkCrack へ）。
 */
var CAVITY = [
  { value: '有', label: '有', hint: '穴（空洞）・樹皮の広範囲な剥離があった' },
  { value: '無', label: '無', hint: 'なかった' },
];

/** 空洞・傷の位置（複数可）。根・幹・枝の3つ */
var CAVITY_PART = [

// ------------------------------------------------------------------
// 部位（複数可）— キノコ部位と空洞・傷の位置で共通に使う
//
// 複数選べるが、CSV・JSONのどこでも同じ形で扱いたいので
// 配列ではなく「根・幹」のような文字列1つで持つ。
// ------------------------------------------------------------------

var PART_SEP = '・';

/** 保存されている文字列を配列にする（順番は定義の並びにそろえる） */
function partList(value, options) {
  options = options || FUNGUS_PART;
  var chosen = String(value == null ? '' : value).split(/[・,、/\s]+/).filter(Boolean);
  return options.map(function (p) { return p.value; }).filter(function (v) {
    return chosen.indexOf(v) >= 0;
  });
}

/** その部位が選ばれているか */
function hasPart(value, code, options) {
  return partList(value, options).indexOf(code) >= 0;
}

/** 部位の入切を切り替えた文字列を返す */
function togglePart(value, code, options) {
  options = options || FUNGUS_PART;
  var cur = partList(value, options);
  var next = cur.indexOf(code) >= 0
    ? cur.filter(function (c) { return c !== code; })
    : cur.concat([code]);
  return options
    .map(function (p) { return p.value; })
    .filter(function (v) { return next.indexOf(v) >= 0; })
    .join(PART_SEP);
}

/** 空の点検内容 */
function emptyInspection() {
  var out = {};
  INSPECTION_FIELDS.forEach(function (k) { out[k] = ''; });
  return out;
}

/** 樹木レコードから点検内容だけを取り出す（無い項目は空文字） */
function pickInspection(tree) {
  tree = tree || {};
  var out = emptyInspection();
  INSPECTION_FIELDS.forEach(function (key) {
    out[key] = tree[key] == null ? '' : tree[key];
  });
  return out;
}

/** Date を <input type="date"> の値（YYYY-MM-DD）にする */

  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* ==================================================================
   §2 採番（本体 src/lib/treeNo.js と同じ内容）
   ここは「純粋関数」だけを置く。DBには触らない。
   ================================================================== */

/** 公園コードの書式チェック（半角英数とハイフンのみ・1文字以上） */
function isValidParkCode(code) {
  return typeof code === 'string' && /^[0-9A-Za-z-]+$/.test(code);
}

/**
 * 既存の公園コード一覧から、次に使う公園コードを求める。
 * 'P' + 数字 形式のものだけを見て、その最大値 + 1 を返す。欠番は埋めない。
 */
function nextParkCode(existingCodes) {
  var max = 0;
  (existingCodes || []).forEach(function (code) {
    var m = /^P(\d+)$/.exec(String(code == null ? '' : code).trim());
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'P' + String(max + 1).padStart(3, '0');
}

/** 公園コードと連番から樹木番号をつくる（例: 'P001', 4 → 'P001004'） */
function formatTreeNo(parkCode, seq) {
  return String(parkCode) + String(seq).padStart(3, '0');
}

/** テープ番号を「ロール記号＋連番」に分ける */
function parseTapeNo(tapeNo) {
  var m = /^\s*([A-Za-z]*)\s*(\d+)\s*$/.exec(String(tapeNo == null ? '' : tapeNo));
  return m ? { prefix: m[1].toUpperCase(), seq: parseInt(m[2], 10) } : null;
}

/**
 * 次のテープ番号を求める。
 * 紙の運用ルール2:「ロールは使い切るまで場所をまたいで連続して使う」。
 * したがって公園では絞らず、端末にあるテープ番号ぜんぶの最大値 +1 を返す。
 * 連番は4桁にそろえる（ラベルに巻いたときに桁がそろって読みやすいため）。
 */
function nextTapeNo(existingTapeNos, roll) {
  var parsed = (existingTapeNos || []).map(parseTapeNo).filter(Boolean);
  var want = String(roll == null ? '' : roll).trim().toUpperCase();

  // ロールを選んでいれば、その記号のものだけを見る
  var pool = want ? parsed.filter(function (p) { return p.prefix === want; }) : parsed;
  var prefix = want;

  // その記号の記録がまだ無いなら、記号を書かない運用の続きとみなす
  if (want && !pool.length) {
    var plain = parsed.filter(function (p) { return p.prefix === ''; });
    if (plain.length) { pool = plain; prefix = ''; }
  }
  // ロール未選択のときは、いちばん大きい番号の記号に合わせる
  if (!want) {
    var top = pool.reduce(function (best, p) {
      return p.seq > (best ? best.seq : -1) ? p : best;
    }, null);
    prefix = top ? top.prefix : '';
  }

  var max = pool.reduce(function (m, p) { return Math.max(m, p.seq); }, 0);
  return prefix + String(max + 1).padStart(4, '0');
}

/**
 * テープ番号から樹木番号を作る。区切りの「-」は入れない。
 * 数字だけのテープ番号は3桁に揃え、それ以外（'A0201' '12b' など）はそのまま後ろに付ける。
 */
function treeNoFromTape(parkCode, tapeNo) {
  var tape = String(tapeNo == null ? '' : tapeNo).trim();
  if (!parkCode || !tape) return '';
  return /^\d+$/.test(tape) ? formatTreeNo(parkCode, parseInt(tape, 10)) : String(parkCode) + tape;
}

/** 樹木番号から連番部分を取り出す。公園コードで始まらない／続きが数字でなければ null */
function parseTreeSeq(treeNo, parkCode) {
  if (typeof treeNo !== 'string' || !parkCode) return null;
  if (treeNo.indexOf(parkCode) !== 0) return null;
  var rest = treeNo.slice(parkCode.length);
  if (!/^\d+$/.test(rest)) return null;
  return parseInt(rest, 10);
}

/** その公園の次の樹木番号（既存の連番の最大値 + 1。カウンタは保存しない） */
function nextTreeNo(parkCode, existingTreeNos) {
  var max = 0;
  (existingTreeNos || []).forEach(function (treeNo) {
    var seq = parseTreeSeq(treeNo, parkCode);
    if (seq !== null) max = Math.max(max, seq);
  });
  return formatTreeNo(parkCode, max + 1);
}

/** 公園コードを変更したときの樹木番号の付け替え（手書きの番号はそのまま残す） */
function renameTreeNoPrefix(treeNo, oldCode, newCode) {
  if (typeof treeNo !== 'string' || !oldCode) return treeNo;
  if (treeNo.indexOf(oldCode) !== 0) return treeNo;
  return newCode + treeNo.slice(oldCode.length);
}

/* ==================================================================
   §3 公園名の照合・公園CSV（本体 src/lib/parkName.js / parkCsv.js）
   ================================================================== */

/** 照合用キー正規化: 空白除去・全角半角統一・ヶ→ケ・漢数字→算用数字 */
function normalizeParkKey(s) {
  if (!s) return '';
  var t = String(s).normalize('NFKC').replace(/[\s　]/g, '');
  t = t.replace(/ヶ/g, 'ケ').replace(/ヵ/g, 'カ');
  var kan = { '〇': '0', '一': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9' };
  t = t.replace(/[〇一二三四五六七八九]/g, function (c) { return kan[c]; });
  return t.toLowerCase();
}

/** キーが一致する公園を返す。無ければ null（selfId の公園は除く） */
function findParkByName(parks, name, selfId) {
  if (!name) return null;
  var key = normalizeParkKey(name);
  if (!key) return null;
  return parks.filter(function (p) {
    return p.id !== selfId && normalizeParkKey(p.name) === key;
  })[0] || null;
}

/** 近い候補を最大3件返す（部分一致・前方一致） */
function parkCandidates(parks, name, selfId) {
  var key = normalizeParkKey(name);
  if (!key) return [];
  return parks
    .filter(function (p) {
      if (p.id === selfId) return false;
      var k = normalizeParkKey(p.name);
      return k.indexOf(key) >= 0 || key.indexOf(k) >= 0 ||
        (key.length >= 2 && k.slice(0, 2) === key.slice(0, 2));
    })
    .slice(0, 3)
    .map(function (p) { return p.name; });
}

/** 公園名の列に使える見出し（樹木台帳メモと同じ順で探す） */
var NAME_HEADERS = ['児童遊園地名', '公園名', 'タイトル'];
var LAT_HEADERS = ['緯度', 'lat', 'Lat', 'latitude'];
var LNG_HEADERS = ['経度', 'lng', 'lon', 'Lng', 'longitude'];

/** CSV 1行パース（ダブルクオート対応） */
function parseCsvLine(line) {
  var out = [];
  var cur = '';
  var inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false;
      } else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

/** 文字コード自動判定（UTF-8で化けたらShift_JISで読み直す） */
function decodeCsvBuffer(buf) {
  var text = new TextDecoder('utf-8').decode(buf);
  if (text.indexOf('�') >= 0) {
    try { text = new TextDecoder('shift_jis').decode(buf); } catch (e) { /* 対応していない環境ではUTF-8のまま */ }
  }
  return text.replace(/^﻿/, '');
}

function findCol(header, candidates) {
  for (var i = 0; i < candidates.length; i++) {
    var at = header.indexOf(candidates[i]);
    if (at >= 0) return at;
  }
  return -1;
}

function toNum(s) {
  var t = String(s == null ? '' : s).trim();
  if (!t) return null;
  var n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/** CSVテキストから公園の行を取り出す */
function parseParkCsv(text) {
  var lines = String(text == null ? '' : text).split(/\r?\n/).filter(function (l) { return l.trim(); });
  if (lines.length < 2) return { ok: false, reason: 'データ行がありません。' };

  var header = parseCsvLine(lines[0]);
  var nameCol = findCol(header, NAME_HEADERS);
  if (nameCol < 0) {
    return { ok: false, reason: '公園名の列が見つかりません（' + NAME_HEADERS.join(' / ') + ' のいずれかが必要です）。' };
  }
  var idCol = header.indexOf('ID');
  var latCol = findCol(header, LAT_HEADERS);
  var lngCol = findCol(header, LNG_HEADERS);

  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    var cells = parseCsvLine(lines[i]);
    var name = (cells[nameCol] || '').trim();
    if (!name) continue;
    rows.push({
      name: name,
      pid: idCol >= 0 ? (cells[idCol] || '').trim() : '',
      lat: latCol >= 0 ? toNum(cells[latCol]) : null,
      lng: lngCol >= 0 ? toNum(cells[lngCol]) : null,
    });
  }
  if (!rows.length) return { ok: false, reason: '公園名の入った行がありませんでした。' };
  return { ok: true, rows: rows };
}

/* ==================================================================
   §4 写真の縮小（本体 src/lib/image.js）
   撮影したままの画像は数MBあるため、保存前に必ず通す。
   ================================================================== */

var MAX_EDGE = 1280;      // 長辺の上限(px)
var QUALITY = 0.7;        // JPEG品質
var THUMB_EDGE = 240;     // 一覧用サムネイルの長辺(px)
var THUMB_QUALITY = 0.6;

function loadImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}

function drawToDataUrl(img, maxEdge, quality) {
  var scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
  var w = Math.round(img.naturalWidth * scale);
  var h = Math.round(img.naturalHeight * scale);
  var canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}

/** 撮影・選択したファイルを保存用（長辺1280 / 品質0.7）に縮小する */
function resizePhoto(file) {
  return loadImage(file).then(function (img) { return drawToDataUrl(img, MAX_EDGE, QUALITY); });
}

/** 一覧に出すサムネイル（長辺240）を dataUrl から作る */
function makeThumb(dataUrl) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(drawToDataUrl(img, THUMB_EDGE, THUMB_QUALITY)); };
    img.onerror = function () { reject(new Error('サムネイルを作成できませんでした')); };
    img.src = dataUrl;
  });
}

/** バイト数を読みやすい単位にする */
function formatBytes(bytes) {
  if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
  var units = ['B', 'KB', 'MB', 'GB'];
  var i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
  return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function csvCell(value) {
  var s = String(value == null ? '' : value);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/** CSV文字列を作る（Excel対策で先頭にBOMを付ける） */
function buildCsv(trees, parkNameById) {

  var rows = trees.map(function (t) {
    return CSV_COLUMNS.map(function (c) {
      return csvCell(c[1](t, parkNameById[t.parkId] || ''));
    }).join(',');
  });
  return '﻿' + [header].concat(rows).join('\r\n') + '\r\n';
}

 */
function buildLegendCsv() {
  var rows = [['項目', '値', '意味']];
  var push = function (name, options) {
    options.forEach(function (o) { rows.push([name, o.value, o.hint || o.label]); });
  };
  push('葉の茂り', LEAF_DENSITY);
  push('活力度_樹勢', VIGOR);
  push('活力度_樹形', TREE_FORM);
  Object.keys(ALERT_LABELS).forEach(function (value) {
    rows.push(['重点観察', value, ALERT_LABELS[value]]);
  });
  return '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n';
}

/** ファイルとして保存させる */
function downloadFile(filename, content, mime) {
  var blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/** 書き出しファイル名に付ける日時（例 20260727-1432） */
function fileStamp(d) {
  d = d || new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

/**
 * 取込内容を「追加するもの」「更新するもの」に仕分ける（純粋関数）。
 * 規則: id が一致したら updatedAt の新しい方を採用。未知の id は追加。
 */
function planMerge(existing, incoming) {
  var plan = { parks: { add: [], update: [] }, trees: { add: [], update: [] }, skipped: 0 };

  var byId = function (list) {
    var m = new Map();
    (list || []).forEach(function (r) { m.set(r.id, r); });
    return m;
  };
  var existingParks = byId(existing.parks);
  var existingTrees = byId(existing.trees);

  var sort = function (incomingList, existingMap, bucket) {
    (incomingList || []).forEach(function (rec) {
      if (!rec || !rec.id) return;
      var cur = existingMap.get(rec.id);
      if (!cur) bucket.add.push(rec);
      else if (String(rec.updatedAt || '') > String(cur.updatedAt || '')) bucket.update.push(rec);
      else plan.skipped += 1;
    });
  };

  sort(incoming.parks, existingParks, plan.parks);
  sort(incoming.trees, existingTrees, plan.trees);
  return plan;
}

/** 読み込んだJSONがこのアプリのバックアップとして扱える形かを確かめる */
function validateBackup(data) {
  if (!data || typeof data !== 'object') return 'JSONとして読み取れませんでした。';
  if (!Array.isArray(data.parks) || !Array.isArray(data.trees)) {
    return 'このファイルには parks / trees が入っていません。';
  }
  if (data.format && data.format !== BACKUP_FORMAT) {
    return '別のアプリのファイルのようです（format: ' + data.format + '）。';
  }
  return null;
}

/* ==================================================================
   §7 保存層（本体 src/db/db.js にあたる）

   本体は Dexie（IndexedDB の薄いラッパー）を使っているが、ここでは
   外部ライブラリを使えないので素の IndexedDB を直接触る。

   保存先の選び方（上から順に試す）
     1. IndexedDB … ふつうはこれ。写真も入る
     2. localStorage … ファイル（file://）から開いた等で IndexedDB が使えないとき。
        容量が小さい（おおむね5MB）ので、写真を多く入れると入りきらないことがある
     3. どちらも使えないとき … 画面上でだけ動く（閉じると消える）。警告を出す

   読み出しを速くするため、公園・樹木・設定は起動時にすべてメモリへ読み込み、
   画面はメモリだけを見る。書き換えるときはメモリと保存先の両方を更新する。
   写真は重いのでメモリに載せず、必要になったときだけ保存先から読む。

   ※ 保存先の名前は本体（Dexieの 'kantantree'）とわざと変えてある。
     同じ端末で本体と単一ファイル版を両方開いても、互いのデータを壊さないため。
     データを行き来させたいときは 設定タブの JSON 書き出し／読み込みを使う。
   ================================================================== */

var DB_NAME = 'kantantree-standalone';
var DB_VERSION = 1;
var LS_PREFIX = 'kantantree-standalone:';

/** 保存先。mode は 'idb' | 'local' | 'memory' */
var store = { mode: 'memory', idb: null, error: '' };

/** IndexedDB を開く。使えなければ null を返す（例外は投げない） */
function openIdb() {
  return new Promise(function (resolve) {
    var idb = null;
    try { idb = window.indexedDB; } catch (e) { idb = null; }
    if (!idb) return resolve(null);
    var req;
    try { req = idb.open(DB_NAME, DB_VERSION); } catch (e) { return resolve(null); }
    req.onupgradeneeded = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains('parks')) db.createObjectStore('parks', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('trees')) {
        db.createObjectStore('trees', { keyPath: 'id' }).createIndex('parkId', 'parkId');
      }
      if (!db.objectStoreNames.contains('photos')) {
        db.createObjectStore('photos', { keyPath: 'id' }).createIndex('treeId', 'treeId');
      }
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { resolve(null); };
    req.onblocked = function () { resolve(null); };
    // 応答が返らない環境（プライベートモード等）で固まらないよう保険をかける
    setTimeout(function () { resolve(req.readyState === 'done' ? req.result : null); }, 3000);
  });
}

/** IndexedDB の1つのストアを全部読む */
function idbGetAll(db, table) {
  return new Promise(function (resolve, reject) {
    var req = db.transaction(table, 'readonly').objectStore(table).getAll();
    req.onsuccess = function () { resolve(req.result || []); };
    req.onerror = function () { reject(req.error); };
  });
}

/**
 * 書き換えをまとめて実行する。IndexedDB では1つのトランザクションで行うので、
 * 途中で失敗したら全部取り消される（公園のまるごと削除などで効く）。
 *
 * ops = { parks:{put:[],del:[]}, trees:{...}, settings:{...},
 *         photos:{put:[], delByTree:[]} }
 */
function idbApply(db, ops) {
  var tables = Object.keys(ops);
  if (!tables.length) return Promise.resolve();
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(tables, 'readwrite');
    tx.oncomplete = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
    tx.onabort = function () { reject(tx.error || new Error('保存を取り消しました')); };
    tables.forEach(function (table) {
      var os = tx.objectStore(table);
      var op = ops[table] || {};
      var putAll = function () { (op.put || []).forEach(function (rec) { os.put(rec); }); };
      (op.del || []).forEach(function (key) { os.delete(key); });

      // 写真の入れ替え（delByTree → put）。消してから入れる順を守る必要がある。
      // 消す処理はカーソルを1件ずつ進めるので、先に put を出すと
      // 入れたばかりの写真まで消してしまう（全部消し終えてから入れる）。
      var waiting = (op.delByTree || []).length;
      if (!waiting) { putAll(); return; }
      (op.delByTree || []).forEach(function (treeId) {
        var cur = os.index('treeId').openCursor(IDBKeyRange.only(treeId));
        cur.onsuccess = function () {
          var c = cur.result;
          if (c) { c.delete(); c.continue(); return; }
          waiting -= 1;
          if (waiting === 0) putAll();
        };
      });
    });
  });
}

/** localStorage 版（IndexedDB が使えないときの控え） */
var lsStore = {
  read: function (key, fallback) {
    try {
      var raw = window.localStorage.getItem(LS_PREFIX + key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  write: function (key, value) {
    window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
  },
  remove: function (key) {
    try { window.localStorage.removeItem(LS_PREFIX + key); } catch (e) { /* 消せなくても続行 */ }
  },
};

/** localStorage が読み書きできるか実際に試す */
function localStorageWorks() {
  try {
    var probe = LS_PREFIX + 'probe';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return true;
  } catch (e) { return false; }
}

// ------------------------------------------------------------------
// メモリ上のデータ（画面はここだけを見る）
// ------------------------------------------------------------------
var mem = { parks: [], trees: [], settings: {} };

/** 起動時に保存先を決めて、中身をメモリへ読み込む */
function openStore() {
  return openIdb().then(function (db) {
    if (db) {
      store.mode = 'idb';
      store.idb = db;
      return Promise.all([idbGetAll(db, 'parks'), idbGetAll(db, 'trees'), idbGetAll(db, 'settings')])
        .then(function (res) {
          mem.parks = res[0];
          mem.trees = res[1];
          mem.settings = {};
          res[2].forEach(function (row) { mem.settings[row.key] = row.value; });
        });
    }
    if (localStorageWorks()) {
      store.mode = 'local';
      store.error = 'この環境では IndexedDB が使えないため、簡易の保存先（localStorage）を使っています。' +
        '容量が小さいので、写真を多く入れると保存できなくなることがあります。こまめにJSONバックアップを取ってください。';
      mem.parks = lsStore.read('parks', []);
      mem.trees = lsStore.read('trees', []);
      mem.settings = lsStore.read('settings', {});
      return null;
    }
    store.mode = 'memory';
    store.error = 'この環境ではブラウザにデータを保存できません（IndexedDB・localStorage のどちらも使えません）。' +
      '入力した内容は画面を閉じると消えます。作業のあとに必ずJSONで書き出してください。';
    return null;
  });
}

/**
 * 書き換えを保存先へ反映する（メモリ側の更新は呼び出し側が済ませておく）。
 * localStorage・メモリのときは配列ごと書き直す。
 */
function persist(ops) {
  if (store.mode === 'idb') {
    return idbApply(store.idb, ops).catch(function (err) {
      showToast('保存に失敗しました: ' + (err && err.message ? err.message : err));
      throw err;
    });
  }
  if (store.mode === 'local') {
    try {
      if (ops.parks) lsStore.write('parks', mem.parks);
      if (ops.trees) lsStore.write('trees', mem.trees);
      if (ops.settings) lsStore.write('settings', mem.settings);
      if (ops.photos) {
        (ops.photos.delByTree || []).forEach(function (treeId) { lsStore.remove('photos:' + treeId); });
        // 写真は樹木ごとに1つのキーへまとめる（全部を書き直さずに済むように）
        var byTree = {};
        (ops.photos.put || []).forEach(function (p) {
          (byTree[p.treeId] = byTree[p.treeId] || []).push(p);
        });
        Object.keys(byTree).forEach(function (treeId) { lsStore.write('photos:' + treeId, byTree[treeId]); });
      }
    } catch (err) {
      showToast('保存できませんでした（保存領域がいっぱいの可能性があります）。JSONで書き出して整理してください。');
      return Promise.reject(err);
    }
  }
  return Promise.resolve();
}

/** その樹木の写真（order順） */
function getTreePhotos(treeId) {
  if (store.mode === 'idb') {
    return new Promise(function (resolve, reject) {
      var req = store.idb.transaction('photos', 'readonly').objectStore('photos')
        .index('treeId').getAll(IDBKeyRange.only(treeId));
      req.onsuccess = function () {
        resolve((req.result || []).sort(function (a, b) { return (a.order || 0) - (b.order || 0); }));
      };
      req.onerror = function () { reject(req.error); };
    });
  }
  if (store.mode === 'local') return Promise.resolve(lsStore.read('photos:' + treeId, []));
  return Promise.resolve((mem.photos || {})[treeId] || []);
}

/** 全部の写真（フルバックアップ用） */
function getAllPhotos() {
  if (store.mode === 'idb') {
    return idbGetAll(store.idb, 'photos');
  }
  return Promise.all(mem.trees.map(function (t) { return getTreePhotos(t.id); })).then(function (lists) {
    return lists.reduce(function (all, list) { return all.concat(list); }, []);
  });
}

/** UUID を作る（crypto.randomUUID が無い環境向けの控えも用意） */
function uid() {
  try {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  } catch (e) { /* 使えなければ下の控えへ */ }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : ((r & 0x3) | 0x8)).toString(16);
  });
}

function nowIso() { return new Date().toISOString(); }

// ------------------------------------------------------------------
// 設定（単一値）
// ------------------------------------------------------------------

function getSetting(key, fallback) {
  return mem.settings[key] === undefined ? (fallback === undefined ? null : fallback) : mem.settings[key];
}

function setSetting(key, value) {
  mem.settings[key] = value;
  return persist({ settings: { put: [{ key: key, value: value }] } });
}

function getSpeciesMaster() { return getSetting('speciesMaster', []) || []; }
function setSpeciesMaster(list) { return setSetting('speciesMaster', list); }
function getSpeciesUsage() { return getSetting('speciesUsage', {}) || {}; }

/**
 * 樹種を使ったことを記録する。マスタに無ければ追加する。
 * count: false のときは使用回数を増やさず、マスタへの登録だけ行う。
 */
function recordSpeciesUse(species, opts) {
  if (!species) return Promise.resolve();
  var count = !opts || opts.count !== false;
  var master = getSpeciesMaster();
  var jobs = [];
  if (master.indexOf(species) < 0) jobs.push(setSpeciesMaster(master.concat([species])));
  if (count) {
    var usage = Object.assign({}, getSpeciesUsage());
    usage[species] = (usage[species] || 0) + 1;
    jobs.push(setSetting('speciesUsage', usage));
  }
  return Promise.all(jobs);
}

// ------------------------------------------------------------------
// 公園
// ------------------------------------------------------------------

/** 次の公園コードを求める（既存コードの最大値+1） */
function suggestParkCode() {
  return nextParkCode(mem.parks.map(function (p) { return p.code; }));
}

/** 公園コードの重複チェック（selfId の公園は除く） */
function isParkCodeTaken(code, selfId) {
  return mem.parks.some(function (p) { return p.code === code && p.id !== selfId; });
}

function addPark(input) {
  var t = nowIso();
  var park = {
    id: uid(),
    code: String(input.code).trim(),
    name: String(input.name).trim(),
    lat: input.lat == null ? null : input.lat,
    lng: input.lng == null ? null : input.lng,
    note: input.note || '',
    lastUsedAt: t,
    createdAt: t,
    updatedAt: t,
  };
  mem.parks.push(park);
  return persist({ parks: { put: [park] } }).then(function () { return park; });
}

/**
 * CSVから読んだ公園をまとめて登録する。
 * 既にある公園（名前の正規化キーが一致）は飛ばす。公園コードは続きから自動採番。
 */
function importParks(rows) {
  var codes = mem.parks.map(function (p) { return p.code; });
  var pool = mem.parks.slice();
  var toAdd = [];
  var skippedNames = [];
  var t = nowIso();
  // 公園の並びは最終使用日時の降順。全部同じ日時にすると順序が不定になるので、
  // CSVの行順がそのまま並び順になるよう1秒ずつずらす。
  var base = Date.now();
  var i = 0;

  rows.forEach(function (row) {
    var name = String(row.name == null ? '' : row.name).trim();
    if (!name) return;
    if (findParkByName(pool, name)) { skippedNames.push(name); return; }
    var code = nextParkCode(codes);
    codes.push(code);
    var park = {
      id: uid(),
      code: code,
      name: name,
      lat: Number.isFinite(row.lat) ? row.lat : null,
      lng: Number.isFinite(row.lng) ? row.lng : null,
      note: '',
      pid: row.pid || '', // 台帳メモ側が持っているID（あれば残しておく）
      lastUsedAt: new Date(base - i * 1000).toISOString(),
      createdAt: t,
      updatedAt: t,
    };
    toAdd.push(park);
    pool.push(park);
    i += 1;
  });

  toAdd.forEach(function (p) { mem.parks.push(p); });
  return persist({ parks: { put: toAdd } }).then(function () {
    return { added: toAdd.length, skipped: skippedNames.length, skippedNames: skippedNames };
  });
}

/**
 * 公園を更新する。コードを変えたとき renumber=true なら、
 * 配下の樹木の treeNo / parkCode も一括で書き換える。
 */
function updatePark(id, patch, opts) {
  var renumber = Boolean(opts && opts.renumber);
  var before = mem.parks.filter(function (p) { return p.id === id; })[0];
  if (!before) return Promise.resolve();
  var after = Object.assign({}, before, patch, { updatedAt: nowIso() });
  mem.parks[mem.parks.indexOf(before)] = after;

  var treePuts = [];
  if (before.code !== after.code) {
    mem.trees.forEach(function (tree, idx) {
      if (tree.parkId !== id) return;
      var updated = Object.assign({}, tree, {
        parkCode: after.code,
        treeNo: renumber ? renameTreeNoPrefix(tree.treeNo, before.code, after.code) : tree.treeNo,
        updatedAt: nowIso(),
      });
      mem.trees[idx] = updated;
      treePuts.push(updated);
    });
  }
  var ops = { parks: { put: [after] } };
  if (treePuts.length) ops.trees = { put: treePuts };
  return persist(ops);
}

/** その公園に属する樹木・写真の件数（削除確認ダイアログ用） */
function countParkContents(parkId) {
  var trees = mem.trees.filter(function (t) { return t.parkId === parkId; });
  var photoCount = trees.reduce(function (n, t) { return n + (t.photoCount || 0); }, 0);
  return { treeCount: trees.length, photoCount: photoCount };
}

/** 公園をまるごと削除（配下の樹木・写真も。IndexedDBでは単一トランザクション） */
function deleteParkCascade(parkId) {
  var treeIds = mem.trees.filter(function (t) { return t.parkId === parkId; }).map(function (t) { return t.id; });
  mem.trees = mem.trees.filter(function (t) { return t.parkId !== parkId; });
  mem.parks = mem.parks.filter(function (p) { return p.id !== parkId; });
  if (store.mode !== 'idb' && mem.photos) treeIds.forEach(function (id) { delete mem.photos[id]; });
  return persist({
    parks: { del: [parkId] },
    trees: { del: treeIds },
    photos: { delByTree: treeIds },
  });
}

/** 公園を「最後に使った」印を付ける（一覧の並び順に使う） */
function touchPark(parkId) {
  if (!parkId) return Promise.resolve();
  var park = mem.parks.filter(function (p) { return p.id === parkId; })[0];
  if (!park) return Promise.resolve();
  park.lastUsedAt = nowIso();
  return persist({ parks: { put: [park] } });
}

// ------------------------------------------------------------------
// 樹木
// ------------------------------------------------------------------

/** その公園の次の樹木番号（テープ番号を使わない場合の後方互換。ふだんは suggestTapeNo を使う） */
function suggestTreeNo(parkId, parkCode) {
  if (!parkId || !parkCode) return '';
  return nextTreeNo(parkCode, mem.trees.filter(function (t) { return t.parkId === parkId; })
    .map(function (t) { return t.treeNo; }));
}

/**
 * 次のテープ番号。テープロールは公園をまたいで連続して使うので、公園で絞らない
 * （樹木番号は公園ごとの採番、テープ番号は端末全体の採番、という違いがある）。
 */
function suggestTapeNo(roll) {
  return nextTapeNo(mem.trees.map(function (t) { return t.tapeNo; }), roll);
}

/** 同一公園内の重複チェック（selfId の樹木は除く） */
function isTreeNoTaken(parkId, treeNo, selfId) {
  if (!parkId || !treeNo) return false;
  return mem.trees.some(function (t) {
    return t.parkId === parkId && t.treeNo === treeNo && t.id !== selfId;
  });
}

/**
 * 樹木を保存する（新規・更新の両方）。写真は dataUrl の配列で受け取り、
 * 1本ぶんをまとめて入れ替える。一覧を軽くするため、1枚目の縮小版を
 * tree.thumb として持たせる。
 */
function saveTree(tree, photoDataUrls) {
  photoDataUrls = photoDataUrls || [];
  var t = nowIso();
  var record = Object.assign({}, tree, {
    id: tree.id || uid(),
    registeredAt: tree.registeredAt || t,
    updatedAt: t,
  });
  // 重点観察区分は保存のたびに付け直す＝行と常に整合する
  record.alertLevel = alertLevel(record);

  var idx = mem.trees.findIndex(function (x) { return x.id === record.id; });
  if (idx >= 0) mem.trees[idx] = record; else mem.trees.push(record);

  var photos = photoDataUrls.map(function (dataUrl, i) {
    return { id: uid(), treeId: record.id, dataUrl: dataUrl, order: i, takenAt: t };
  });
  if (store.mode === 'memory') {
    mem.photos = mem.photos || {};
    mem.photos[record.id] = photos;
  }

  var park = mem.parks.filter(function (p) { return p.id === record.parkId; })[0];
  var ops = {
    trees: { put: [record] },
    photos: { delByTree: [record.id], put: photos },
  };
  if (park) {
    park.lastUsedAt = t;
    ops.parks = { put: [park] };
  }
  return persist(ops).then(function () { return record; });
}

/** 樹木を削除（写真も一緒に） */
function deleteTrees(treeIds) {
  if (!treeIds.length) return Promise.resolve();
  mem.trees = mem.trees.filter(function (t) { return treeIds.indexOf(t.id) < 0; });
  if (store.mode !== 'idb' && mem.photos) treeIds.forEach(function (id) { delete mem.photos[id]; });
  return persist({ trees: { del: treeIds }, photos: { delByTree: treeIds } });
}

/** ストレージ使用量の概算（ブラウザが対応していれば） */
function estimateStorage() {
  if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
  return navigator.storage.estimate().then(function (res) {
    return { usage: res.usage || 0, quota: res.quota || 0 };
  }).catch(function () { return null; });
}

/* ==================================================================
   §8 画面の下ごしらえ

   本体は React で画面を組み立てているが、ここでは素のDOMで作る。
   考え方は同じで、「状態（state）を書き換えたら、その画面をもう一度作り直す」。
   文字入力の欄だけは、打つたびに作り直すと入力位置が飛ぶので、
   state を書き換えるだけにして作り直さない。
   ================================================================== */

/**
 * 要素を1つ作る。
 * attrs: { class, text, html, value, onclick, oninput, disabled, ... }
 *   'on' で始まるものはイベント（onclick → click）。
 * children: 子要素（文字列・要素・null が混ざってよい）
 */
function el(tag, attrs, children) {
  var node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (key) {
    var v = attrs[key];
    if (v == null || v === false) return;
    if (key === 'class') node.className = v;
    else if (key === 'text') node.textContent = v;
    else if (key === 'html') node.innerHTML = v;
    else if (key === 'value') node.value = v;
    else if (key === 'checked' || key === 'disabled' || key === 'hidden' || key === 'multiple') node[key] = Boolean(v);
    else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), v);
    else node.setAttribute(key, v);
  });
  (children || []).forEach(function (child) {
    if (child == null || child === false) return;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  });
  return node;
}

/** ボタン（type="button" を付け忘れるとフォーム送信になるので必ずここを通す） */
function button(label, cls, onClick, attrs) {
  return el('button', Object.assign({ type: 'button', class: cls, text: label, onclick: onClick }, attrs || {}));
}

/** ラベル付きの入力欄。oninput は「値が変わるたび」に呼ばれる */
function field(labelText, inputAttrs, opts) {
  opts = opts || {};
  return el('label', { class: 'field' + (opts.class ? ' ' + opts.class : '') }, [
    el('span', { class: 'field-label', text: labelText }),
    el(opts.tag || 'input', inputAttrs),
  ]);
}

/**
 * 紙のチェックシートで「〇を付ける」欄にあたる部品。
 * もう一度押すと選択が外れる（間違えて押したときに戻せるように）。
 *   multi: true のときは isOn(value) で入切を判定し、onChange には押した value を渡す
 */
function choiceRow(labelText, options, value, onChange, opts) {
  opts = opts || {};
  var buttons = options.map(function (opt) {
    var on = opts.multi ? opts.isOn(opt.value) : value === opt.value;
    return button(opt.label, 'choice' + (on ? ' choice-on' : ''), function () {
      onChange(opts.multi ? opt.value : (on ? '' : opt.value));
    }, { 'aria-pressed': on ? 'true' : 'false', title: opt.hint || null });
  });
  return el('div', { class: 'choice-row' }, [
    el('span', { class: 'choice-label', text: labelText }),
    el('div', { class: 'choice-opts' }, buttons),
    opts.hint ? el('span', { class: 'choice-hint', text: opts.hint }) : null,
  ]);
}

/** 数値のプリセット（樹高・樹冠幅）。押すと入り、もう一度押すと外れる */
function presetRow(labelText, presets, value, onChange, hint, ariaLabel) {
  var buttons = presets.map(function (m) {
    var on = String(value) === String(m);
    return button(String(m), 'choice' + (on ? ' choice-on' : ''), function () {
      onChange(on ? '' : m);
    }, { 'aria-pressed': on ? 'true' : 'false' });
  });
  var free = el('input', {
    type: 'number', inputmode: 'decimal', step: '0.5', value: value === '' || value == null ? '' : value,
    placeholder: '他', 'aria-label': ariaLabel,
    oninput: function (e) { onChange(e.target.value, { silent: true }); },
  });
  return el('div', { class: 'choice-row' }, [
    el('span', { class: 'choice-label', text: labelText }),
    el('div', { class: 'choice-opts' }, buttons),
    el('div', { class: 'height-free' }, [free, el('span', { class: 'choice-hint', text: hint })]),
  ]);
}

/** 公園を最終使用日時の降順で並べる（よく使う公園が左に来る） */
function sortedParks() {
  return mem.parks.slice().sort(function (a, b) {
    return String(b.lastUsedAt || '').localeCompare(String(a.lastUsedAt || ''));
  });
}

function parkById(id) {
  return mem.parks.filter(function (p) { return p.id === id; })[0] || null;
}

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate());
}

// 画面の状態
// ------------------------------------------------------------------
var state = {
  tab: 'register',
  currentParkId: null, // 登録タブで選んでいる公園
  listParkId: null,    // 一覧の絞り込み（null=すべて）
  editingTree: null,   // 編集中の樹木（null なら新規登録）
  form: null,          // 登録フォームの入力内容（initForm で作る）
  list: { query: '', selectMode: false, selected: [] },
  settings: {
    parkEditing: null,   // null=閉じている / {} =新規 / park =編集
    parkForm: { code: '', name: '', note: '' },
    parkError: '',
    speciesText: '',
    sheet: { parkId: '', surveyDate: '', surveyor: '', tapeRoll: '', rows: 14 },
    sheetOpen: false,
    storage: null,
    lastBackupAt: null,
  },
};

var rootEl = document.getElementById('root');
var mainEl = null;
var toastTimer = null;

/** 画面下の吹き出し。2.6秒で消える */
function showToast(message) {
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var node = el('div', { class: 'toast', text: message });
  rootEl.appendChild(node);
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(function () { node.remove(); }, 2600);
}

/** 今のタブの中身を作り直す。スクロール位置は保つ（作り直すと先頭へ戻るため） */
function render() {
  var top = mainEl ? mainEl.scrollTop : 0;
  var pane;
  if (state.tab === 'register') pane = renderRegisterPane();
  else if (state.tab === 'list') pane = renderListPane();
  else pane = renderSettingsPane();

  mainEl.textContent = '';
  mainEl.appendChild(pane);
  mainEl.scrollTop = top;
  renderTabbar();
  renderAppbar();
}

var TABS = [
  { key: 'register', label: '登録' },
  { key: 'list', label: '一覧' },
  { key: 'settings', label: '設定' },
];

function renderTabbar() {
  var bar = document.querySelector('.tabbar');
  bar.textContent = '';
  TABS.forEach(function (t) {
    bar.appendChild(button(t.label, 'tabbtn' + (state.tab === t.key ? ' tabbtn-on' : ''), function () {
      if (t.key !== 'register' && state.editingTree) finishEdit();
      state.tab = t.key;
      if (mainEl) mainEl.scrollTop = 0;
      render();
    }));
  });
}

function renderAppbar() {
  var bar = document.querySelector('.appbar');
  bar.textContent = '';
  bar.appendChild(el('h1', {}, [
    'かんたん樹木登録',
    state.editingTree ? el('span', { class: 'appbar-sub', text: '編集中' }) : null,
  ]));
  bar.appendChild(el('span', {
    class: 'appbar-note',
    text: store.mode === 'idb' ? '端末内に保存' : (store.mode === 'local' ? '簡易保存' : '保存できません'),
  }));
}

/* ==================================================================
   §9 登録タブ（本体 src/components/RegisterForm ほか）
   ここの摩擦をゼロにするのが最優先。並びは紙のチェックシートと同じ。
   ================================================================== */

var MAX_PHOTOS = 3;
var TILE_LIMIT = 12;

/** 使用回数の降順（同数ならマスタの並び順）で上位12件を返す */
function orderSpecies(master, usage, limit) {
  return master
    .map(function (name, i) { return { name: name, count: usage[name] || 0, i: i }; })
    .sort(function (a, b) { return b.count - a.count || a.i - b.i; })
    .slice(0, limit || TILE_LIMIT)
    .map(function (x) { return x.name; });
}

/** 新規登録用にフォームを作り直す（前回の樹種・調査情報は引き継ぐ） */
function initForm() {
  var last = getSetting('lastSurvey', null);
  state.form = {
    treeNo: '',
    treeNoEdited: false,
    tapeEdited: false,
    species: getSetting('lastSpecies', '') || '',
    photos: [],
    girth: '',
    note: '',
    optionOpen: false,
    saving: false,
    otherOpen: false,   // 樹種の「その他（入力）」を開いているか
    photoBusy: false,   // 写真を縮小している最中か
    photoError: '',
    inspection: emptyInspection(),
    survey: Object.assign(emptySurvey(), last || {}),
    surveyOpen: false,
  };
  applyTapeSuggestion();
}

/**
 * 次のテープ番号と樹木番号を入れ直す。
 * 手で直したあと（tapeEdited / treeNoEdited）は上書きしない。
 */
function applyTapeSuggestion() {
  var form = state.form;
  if (!form || state.editingTree || form.tapeEdited) return;
  var park = parkById(state.currentParkId);
  var tape = suggestTapeNo(form.survey.tapeRoll);
  form.inspection.tapeNo = tape;
  if (!form.treeNoEdited) form.treeNo = park ? treeNoFromTape(park.code, tape) : '';
}

/** 一覧から編集を開く */
function openEdit(tree) {
  state.editingTree = tree;
  state.tab = 'register';
  state.form = {
    treeNo: tree.treeNo || '',
    treeNoEdited: true,
    tapeEdited: true,
    species: tree.species || '',
    photos: [],
    girth: tree.girth == null ? '' : tree.girth,
    note: tree.note || '',
    optionOpen: Boolean(tree.girth || tree.note),
    saving: false,
    otherOpen: false,
    photoBusy: false,
    photoError: '',
    inspection: pickInspection(tree),
    survey: {
      surveyDate: tree.surveyDate || '',
      surveyor: tree.surveyor || '',
      tapeRoll: tree.tapeRoll || '',
    },
    surveyOpen: false,
  };
  render();
  // 写真は重いので後から読み込み、届いたら画面を作り直す
  getTreePhotos(tree.id).then(function (rows) {
    if (state.editingTree !== tree) return;
    state.form.photos = rows.map(function (r) { return r.dataUrl; });
    render();
  });
}

/** 編集をやめて新規登録の状態に戻す */
function finishEdit() {
  state.editingTree = null;
  initForm();
}

/** 登録タブの中身を作る */
function renderRegisterPane() {
  if (!state.form) initForm();
  var form = state.form;
  var isEdit = Boolean(state.editingTree);
  var parkId = isEdit ? state.editingTree.parkId : state.currentParkId;
  var park = parkById(parkId);

  if (!mem.parks.length) {
    return el('div', { class: 'pane' }, [
      el('div', { class: 'empty' }, [
        el('p', { text: '公園がまだ登録されていません。' }),
        button('公園を登録する', 'btn btn-primary', function () {
          state.tab = 'settings';
          state.settings.parkEditing = {};
          state.settings.parkForm = { code: suggestParkCode(), name: '', note: '' };
          render();
        }),
      ]),
    ]);
  }

  var pane = el('div', { class: 'pane pane-form' });

  // --- 1. 公園（紙の「場所」） ---
  if (!isEdit) {
    pane.appendChild(el('section', { class: 'block' }, [
      el('h3', { class: 'block-title', text: '公園' }),
      el('div', { class: 'chips' }, sortedParks().map(function (p) {
        return button(p.name, 'chip' + (p.id === parkId ? ' chip-on' : ''), function () {
          state.currentParkId = p.id;
          touchPark(p.id);
          applyTapeSuggestion();
          render();
        });
      })),
    ]));
  }

  // --- 2. 調査情報（紙の表頭。折りたたみ） ---
  pane.appendChild(renderSurveyInfo(form, park));

  // --- 3. テープ番号・樹木番号 ---
  var dupNode = el('p', { class: 'status status-error' });
  var treeNoInput = el('input', {
    class: 'treeno-input', type: 'text', value: form.treeNo, placeholder: 'P0010001',
    oninput: function (e) {
      form.treeNo = e.target.value;
      form.treeNoEdited = true;
      updateDup();
    },
  });
  function updateDup() {
    var taken = isTreeNoTaken(parkId, form.treeNo.trim(), isEdit ? state.editingTree.id : null);
    dupNode.textContent = taken ? '同じ公園にこの番号がすでにあります。' : '';
    dupNode.hidden = !taken; // 空のまま置くと余白だけが残るので隠す
  }
  var tapeInput = el('input', {
    type: 'text', inputmode: 'numeric', value: form.inspection.tapeNo, placeholder: '0001',
    oninput: function (e) {
      form.inspection.tapeNo = e.target.value;
      form.tapeEdited = true;
      // 紙のシートの「樹木番号（公園コード+テープ番号）」に従って樹木番号も作り直す。
      // 樹木番号を手で直したあとは上書きしない。
      if (!isEdit && !form.treeNoEdited && park) {
        var derived = treeNoFromTape(park.code, e.target.value);
        if (derived) {
          form.treeNo = derived;
          treeNoInput.value = derived;
        }
      }
      updateDup();
    },
  });
  updateDup();

  pane.appendChild(el('section', { class: 'block' }, [
    el('h3', { class: 'block-title' }, [
      'テープ番号・樹木番号 ',
      isEdit ? null : el('span', { class: 'muted', text: '（次の番号。タップで編集）' }),
    ]),
    el('div', { class: 'field-row' }, [
      el('label', { class: 'field field-tape' }, [
        el('span', { class: 'field-label', text: 'テープ番号' }), tapeInput,
      ]),
      el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: '樹木番号（公園コード＋テープ番号）' }), treeNoInput,
      ]),
    ]),
    isEdit && park ? el('p', { class: 'hint', text: '公園: ' + park.name }) : null,
    dupNode,
  ]));

  // --- 4. 樹種タイル ---
  pane.appendChild(renderSpeciesTiles(form));

  // --- 5. 点検内容 ---
  pane.appendChild(renderInspectionFields(form));

  // --- 6. 写真 ---
  pane.appendChild(renderPhotoInput(form));

  // 本体（React版）で入れた座標は、この版では編集できないが消さずに持ち続ける
  if (isEdit && Number.isFinite(state.editingTree.lat)) {
    pane.appendChild(el('section', { class: 'block' }, [
      el('h3', { class: 'block-title', text: '座標' }),
      el('p', { class: 'hint', text: state.editingTree.lat.toFixed(6) + ', ' + state.editingTree.lng.toFixed(6) +
        ' — この版ではGPSを使わないため編集できません（保存しても消えません）。' }),
    ]));
  }

  // --- 7. 任意項目（折りたたみ） ---
  var optionBody = [];
  if (form.optionOpen) {
    optionBody.push(field('幹周 (cm)', {
      type: 'number', inputmode: 'decimal', step: '1', value: form.girth,
      oninput: function (e) { form.girth = e.target.value; },
    }));
    optionBody.push(field('メモ', {
      rows: 3, value: form.note,
      oninput: function (e) { form.note = e.target.value; },
    }, { tag: 'textarea' }));
  }
  pane.appendChild(el('section', { class: 'block' }, [
    button((form.optionOpen ? '▼' : '▶') + ' 任意項目（幹周・メモ）', 'disclosure', function () {
      form.optionOpen = !form.optionOpen;
      render();
    }),
  ].concat(optionBody)));

  // --- 8. 固定フッターの大きな［登録］ボタン ---
  var saveBtn = button(form.saving ? '保存中…' : (isEdit ? '更新' : '登録'), 'btn btn-primary btn-big',
    function () { handleSave(park); }, { disabled: form.saving || !park });
  pane.appendChild(el('div', { class: 'form-foot' }, [
    isEdit ? button('キャンセル', 'btn btn-ghost btn-big', function () { finishEdit(); render(); }) : null,
    saveBtn,
  ]));

  return pane;
}

/** 調査情報（紙のチェックシートの表頭）。1枚のシートで共通なので登録のたびに引き継ぐ */
function renderSurveyInfo(form, park) {
  var v = form.survey;
  var summary = [
    park ? park.name : '公園未選択',
    v.surveyDate || '調査日なし',
    v.surveyor || '調査者なし',
    v.tapeRoll ? 'ロール' + v.tapeRoll : '',
  ].filter(Boolean).join(' / ');

  var body = [];
  if (form.surveyOpen) {
    body.push(el('p', { class: 'hint', text:
      '1枚のチェックシートで共通の項目です。登録のたびに引き継ぎます。場所は上で選んでいる公園（' +
      (park ? park.name : '未選択') + '）を使います。' }));
    body.push(el('div', { class: 'field-row' }, [
      field('調査日', {
        type: 'date', value: v.surveyDate,
        oninput: function (e) { v.surveyDate = e.target.value; },
      }),
      field('調査者', {
        type: 'text', value: v.surveyor, placeholder: '例 橘川',
        oninput: function (e) { v.surveyor = e.target.value; },
      }),
    ]));
    body.push(choiceRow('テープロール', TAPE_ROLLS.map(function (c) { return { value: c, label: c }; }),
      v.tapeRoll, function (next) {
        v.tapeRoll = next;
        // ロールが変わったら、そのロールの続きの番号を出し直す
        applyTapeSuggestion();
        render();
      }));
  }

  // 見出しボタンの中に要約（場所 / 調査日 / 調査者 / ロール）を入れる
  var head = el('button', { type: 'button', class: 'disclosure', onclick: function () {
    form.surveyOpen = !form.surveyOpen;
    render();
  } }, [
    (form.surveyOpen ? '▼' : '▶') + ' 調査情報',
    form.surveyOpen ? null : el('span', { class: 'muted survey-summary', text: summary }),
  ]);
  return el('section', { class: 'block' }, [head].concat(body));
}

/** 樹種タイル。よく使う樹種を12枚まで、使用回数の降順で並べる */
function renderSpeciesTiles(form) {
  var master = getSpeciesMaster();
  var usage = getSpeciesUsage();
  var tiles = orderSpecies(master, usage);
  // 選択中の樹種が上位12件に入っていないときは、見失わないよう先頭に足す
  var shown = form.species && form.species !== '不明' && tiles.indexOf(form.species) < 0
    ? [form.species].concat(tiles)
    : tiles;

  var otherInput = null;
  var commitOther = function () {
    var name = otherInput.value.trim();
    if (!name) return;
    form.species = name;
    form.otherOpen = false;
    render();
  };

  var body = [
    el('h3', { class: 'block-title', text: '樹種' }),
    el('div', { class: 'tiles' }, shown.map(function (name) {
      return button(name, 'tile' + (form.species === name ? ' tile-on' : ''), function () {
        form.species = name;
        render();
      });
    }).concat([
      button('その他（入力）', 'tile tile-sub' + (form.otherOpen ? ' tile-on' : ''), function () {
        form.otherOpen = !form.otherOpen;
        render();
      }),
      button('不明', 'tile tile-sub' + (form.species === '不明' ? ' tile-on' : ''), function () {
        form.species = '不明';
        render();
      }),
    ])),
  ];

  if (form.otherOpen) {
    otherInput = el('input', {
      type: 'text', placeholder: '樹種名を入力（例 クスノキ）',
      onkeydown: function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commitOther(); }
      },
    });
    body.push(el('div', { class: 'link-row' }, [otherInput, button('決定', 'btn btn-ghost', commitOther)]));
    setTimeout(function () { otherInput.focus(); }, 0);
  } else if (!shown.length) {
    body.push(el('p', { class: 'hint', text:
      'まだ樹種がありません。「その他（入力）」から入れると、次から樹種タイルに並びます。' }));
  }

  return el('section', { class: 'block' }, body);
}

/** 点検内容（紙の「樹木点検 現地チェックシート」1ページ目の各行の項目） */
function renderInspectionFields(form) {
  var v = form.inspection;
  var set = function (key, next) { v[key] = next; render(); };
  // 値だけ書き換えて画面は作り直さない（文字入力の途中で入力位置が飛ばないように）
  var setQuiet = function (key, next) { v[key] = next; };

  var body = [el('h3', { class: 'block-title', text: '点検内容' })];

  // 樹高・樹冠幅。現場では測らないので、よく使う値を押すだけで入る
  body.push(presetRow('樹高 (m)', HEIGHT_PRESETS, v.height, function (next, opts) {
    if (opts && opts.silent) setQuiet('height', next); else set('height', next);
  }, 'm — 上に無い高さはここへ。目分量でよい（巻尺は使わない）', '樹高（自由入力）'));

  body.push(presetRow('樹冠幅 (m)', CROWN_WIDTH_PRESETS, v.crownWidth, function (next, opts) {
    if (opts && opts.silent) setQuiet('crownWidth', next); else set('crownWidth', next);
  }, 'm — 枝の広がりの差し渡し。任意（入れなくてよい）', '樹冠幅（自由入力）'));

  body.push(choiceRow('区分', VEG_CLASS, v.vegClass, function (next) { set('vegClass', next); },
    { hint: '高木=おおむね3m以上 / 中木=1.5〜3m / 低木=1.5m未満。任意' }));

  body.push(choiceRow('葉の茂り', LEAF_DENSITY, v.leafDensity, function (next) { set('leafDensity', next); },
    { hint: '濃=枝先まで密 / 普=ふつう / ま=まばら（空が透ける）/ ほ=ほとんどない　※迷ったら「普」' }));

  body.push(choiceRow('キノコ', FUNGUS, v.fungus, function (next) {
    // 「無」「未」に変えたら部位は消す（紙でも部位は書かないため）
    v.fungus = next;
    if (next !== '有') v.fungusPart = '';
    render();
  }, { hint: '無=見たが無かった / 未=見ていない・見えない　※必ず区別する。キノコの大小・有無は腐朽の程度の目安にはならない（小さくても・無くても内部が腐朽していることがある）ので、あれば大小に関わらず記録する' }));

  if (v.fungus === '有') {
    body.push(choiceRow('キノコ部位', FUNGUS_PART, null, function (code) {
      set('fungusPart', togglePart(v.fungusPart, code, FUNGUS_PART));
    }, {
      multi: true,
      isOn: function (code) { return hasPart(v.fungusPart, code, FUNGUS_PART); },
      hint: '複数選べます（根=根元 / 幹=生きた幹 / 枝=枝の付け根 / 枯=枯枝・枯幹 / 不=不明）',
    }));
  }

  body.push(choiceRow('空洞・傷', CAVITY, v.cavity, function (next) {
    // 「無」に変えたら位置は消す（キノコ部位と同じ考え方）
    v.cavity = next;
    if (next !== '有') v.cavityPart = '';
    render();
  }, { hint: '穴（空洞）・樹皮の広範囲な剥離。大きさの基準はなし。気になったら「有」　※割れ目・裂けは下の「樹幹の亀裂」へ' }));

  if (v.cavity === '有') {
    body.push(choiceRow('空洞・傷の位置', CAVITY_PART, null, function (code) {
      set('cavityPart', togglePart(v.cavityPart, code, CAVITY_PART));
    }, {
      multi: true,
      isOn: function (code) { return hasPart(v.cavityPart, code, CAVITY_PART); },
      hint: '複数選べます',
    }));
  }

  // 国交省 主要項目: 樹幹の揺らぎ → 不自然な傾斜 → 亀裂
  body.push(choiceRow('樹幹の揺らぎ', TRUNK_SWAY, v.trunkSway, function (next) { set('trunkSway', next); },
    { hint: '幹を押すと根鉢ごと動く・地際が浮く（倒木直前のサイン）' }));
  body.push(choiceRow('樹幹の不自然な傾斜', TRUNK_LEAN, v.trunkLean, function (next) { set('trunkLean', next); },
    { hint: '近年傾いた・根元が持ち上がる等の不自然な傾き' }));
  body.push(choiceRow('樹幹の亀裂', TRUNK_CRACK, v.trunkCrack, function (next) { set('trunkCrack', next); },
    { hint: '幹の割れ目・裂け・縦の亀裂。気になったら「有」' }));
  body.push(choiceRow('結合部の異常（入り皮）', BARK_INCLUSION, v.barkInclusion, function (next) { set('barkInclusion', next); },
    { hint: '二又や枝の付け根の合わせ目に樹皮が巻き込まれている（裂けやすい）' }));
  body.push(choiceRow('フラス', FRASS, v.frass, function (next) { set('frass', next); },
    { hint: '木くずとフンが混ざったうどん状・かりんとう状の排出物。サクラ・ウメ・モモを重点確認' }));

  // 活力度（国交省）。段階は 1＝良い 〜 4
  body.push(choiceRow('活力度・樹勢', VIGOR, v.vigor, function (next) { set('vigor', next); },
    { hint: '1=良い / 2=少し悪い / 3=悪い / 4=枯死（ナラ枯れ・マツ枯れ等）' }));
  body.push(choiceRow('活力度・樹形', TREE_FORM, v.treeForm, function (next) { set('treeForm', next); },
    { hint: '1=望ましい樹形 / 2=乱れがある / 3=著しく乱れ回復困難 / 4=完全に崩壊' }));

  // 周辺環境。倒れたときに何にかかるかの目安
  var envAllNone = ENV_ITEMS.every(function (item) { return v[item.key] === '無'; });
  var envBody = [
    el('div', { class: 'env-head' }, [
      el('span', { class: 'choice-label', text: '周辺環境' }),
      button('すべて無', 'btn btn-ghost btn-small' + (envAllNone ? ' btn-on' : ''), function () {
        ENV_ITEMS.forEach(function (item) { v[item.key] = '無'; });
        render();
      }),
    ]),
  ];
  ENV_ITEMS.forEach(function (item) {
    envBody.push(choiceRow(item.label, ENV_PRESENCE, v[item.key], function (next) { set(item.key, next); }));
  });
  envBody.push(field('周辺環境の備考', {
    type: 'text', value: v.envNote, placeholder: '例 園路に張り出し（自由記入）',
    oninput: function (e) { setQuiet('envNote', e.target.value); },
  }));
  body.push(el('div', { class: 'env-block' }, envBody));

  body.push(field('注意', {
    type: 'text', value: v.caution, placeholder: '気になった木に印（自由記入）',
    oninput: function (e) { setQuiet('caution', e.target.value); },
  }));

  // 紙の運用ルール4「見つけたらすぐ連絡すること」。その場で気づけるよう出す
  urgentNotes(v).forEach(function (note) {
    body.push(el('p', { class: 'status status-error', text: '⚠ ' + note }));
  });

  return el('section', { class: 'block' }, body);
}

/** 写真（撮影・アルバムから選択）。保存前に長辺1280 / 品質0.7へ縮小する */
function renderPhotoInput(form) {
  var handleFiles = function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = ''; // 同じ写真をもう一度選べるようにする
    if (!files.length) return;
    var room = MAX_PHOTOS - form.photos.length;
    var targets = files.slice(0, room);
    form.photoBusy = true;
    render();
    Promise.all(targets.map(resizePhoto)).then(function (added) {
      form.photos = form.photos.concat(added);
      form.photoError = files.length > room ? '写真は' + MAX_PHOTOS + '枚までです。' : '';
    }).catch(function (err) {
      form.photoError = err && err.message ? err.message : '写真を読み込めませんでした。';
    }).then(function () {
      form.photoBusy = false;
      render();
    });
  };

  var camera = el('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true, onchange: handleFiles });
  var album = el('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true, onchange: handleFiles });
  var full = form.photos.length >= MAX_PHOTOS;

  var body = [
    el('h3', { class: 'block-title' }, [
      '写真 ', el('span', { class: 'muted', text: '（' + form.photos.length + '/' + MAX_PHOTOS + '）' }),
    ]),
    camera,
    album,
    el('div', { class: 'btn-row' }, [
      button(form.photoBusy ? '処理中…' : '📷 撮影', 'btn', function () { camera.click(); },
        { disabled: form.photoBusy || full }),
      button('🖼 アルバムから', 'btn btn-ghost', function () { album.click(); },
        { disabled: form.photoBusy || full }),
    ]),
  ];

  if (form.photos.length) {
    body.push(el('div', { class: 'thumbs' }, form.photos.map(function (src, i) {
      return el('button', { type: 'button', class: 'thumb', title: 'タップで削除', onclick: function () {
        form.photos.splice(i, 1);
        render();
      } }, [
        el('img', { src: src, alt: '写真' + (i + 1) }),
        el('span', { class: 'thumb-x', text: '×' }),
      ]);
    })));
    body.push(el('p', { class: 'hint', text: 'サムネイルをタップすると削除します。' }));
  }
  if (form.photoError) body.push(el('p', { class: 'status status-error', text: form.photoError }));

  return el('section', { class: 'block' }, body);
}

/** 登録・更新 */
function handleSave(park) {
  var form = state.form;
  var isEdit = Boolean(state.editingTree);
  if (!park) return;
  if (!form.treeNo.trim()) {
    showToast('樹木番号を入れてください。');
    return;
  }
  if (isTreeNoTaken(park.id, form.treeNo.trim(), isEdit ? state.editingTree.id : null)) {
    var ok = window.confirm(form.treeNo + ' は同じ公園にすでにあります。\n' +
      'このまま登録しますか？（一覧に「重複」バッジが付きます）');
    if (!ok) return;
  }

  form.saving = true;
  render();

  var v = form.inspection;
  var num = function (x) { return x === '' || x == null ? null : Number(x); };

  (form.photos.length ? makeThumb(form.photos[0]) : Promise.resolve(null)).then(function (thumb) {
    var record = Object.assign({}, state.editingTree || {}, {
      id: isEdit ? state.editingTree.id : undefined,
      parkId: park.id,
      parkCode: park.code,
      treeNo: form.treeNo.trim(),
      species: form.species || '不明',
      girth: num(form.girth),
      note: form.note.trim(),
      thumb: thumb,
      // 点検内容（紙のチェックシート1ページ目）
      tapeNo: v.tapeNo.trim(),
      height: num(v.height),
      crownWidth: num(v.crownWidth),
      vegClass: v.vegClass,
      leafDensity: v.leafDensity,
      fungus: v.fungus,
      fungusPart: v.fungusPart,
      cavity: v.cavity,
      cavityPart: v.cavityPart,
      trunkSway: v.trunkSway,
      trunkLean: v.trunkLean,
      trunkCrack: v.trunkCrack,
      barkInclusion: v.barkInclusion,
      frass: v.frass,
      vigor: v.vigor,
      treeForm: v.treeForm,
      envRoad: v.envRoad,
      envWire: v.envWire,
      envBuilding: v.envBuilding,
      envNote: v.envNote.trim(),
      caution: v.caution.trim(),
      photoCount: form.photos.length, // 紙の「写真」欄にあたる
      // 調査情報（表頭）
      surveyDate: form.survey.surveyDate,
      surveyor: form.survey.surveyor.trim(),
      tapeRoll: form.survey.tapeRoll,
    });
    // 座標はこの版では入力しないが、本体で入れた値は消さずに引き継ぐ
    return saveTree(record, form.photos);
  }).then(function (saved) {
    // 使用回数は新規登録のときだけ増やす（編集のたびに増えると並び順が実態とずれる）
    return recordSpeciesUse(saved.species, { count: !isEdit }).then(function () {
      return Promise.all([
        setSetting('lastSpecies', saved.species),
        setSetting('lastSurvey', {
          surveyDate: form.survey.surveyDate,
          surveyor: form.survey.surveyor.trim(),
          tapeRoll: form.survey.tapeRoll,
        }),
      ]);
    }).then(function () { return saved; });
  }).then(function (saved) {
    if (isEdit) {
      showToast(saved.treeNo + ' を更新しました');
      finishEdit();
    } else {
      showToast(saved.treeNo + ' を登録しました');
      // 公園・樹種・調査情報は保持。写真・任意項目・点検内容はクリアして番号を +1 する
      var keep = { species: form.species, survey: form.survey };
      initForm();
      state.form.species = keep.species;
      state.form.survey = keep.survey;
      applyTapeSuggestion();
    }
    render();
  }).catch(function (err) {
    state.form.saving = false;
    showToast('保存に失敗しました: ' + (err && err.message ? err.message : err));
    render();
  });
}

/** 絞り込み・検索の結果（樹木番号の昇順） */
function shownTrees() {
  var list = state.list;
  var base = state.listParkId
    ? mem.trees.filter(function (t) { return t.parkId === state.listParkId; })
    : mem.trees.slice();
  var q = list.query.trim().toLowerCase();
  var filtered = q
    ? base.filter(function (t) {
        return [t.treeNo, t.species, t.note, t.caution].some(function (v) {
          return String(v == null ? '' : v).toLowerCase().indexOf(q) >= 0;
        });
      })
    : base;
  return filtered.sort(function (a, b) {
    return String(a.treeNo || '').localeCompare(String(b.treeNo || ''), 'ja', { numeric: true });
  });
}

/** カードの一覧を入れ替える */
function fillCards(wrap) {
  var list = state.list;
  var trees = shownTrees();
  wrap.textContent = '';

  if (!trees.length) {
    wrap.appendChild(el('p', { class: 'muted pad',
      text: list.query ? '見つかりませんでした。' : 'まだ登録がありません。' }));
    return;
  }

  // 同一公園内で重複している番号を洗い出す（重複バッジ用）
  var seen = {};
  mem.trees.forEach(function (t) {
    var key = t.parkId + '|' + t.treeNo;
    seen[key] = (seen[key] || 0) + 1;
  });

  var parkNameById = {};
  mem.parks.forEach(function (p) { parkNameById[p.id] = p.name; });

  wrap.appendChild(el('ul', { class: 'cards' }, trees.map(function (t) {
    var isDup = seen[t.parkId + '|' + t.treeNo] > 1;
    var picked = list.selected.indexOf(t.id) >= 0;
    var meta = [];
    if (!state.listParkId) meta.push(el('span', { class: 'badge', text: parkNameById[t.parkId] || '-' }));
    // 点検で「有」だったものは現場で拾いたいので目立たせる
    inspectionBadges(t).forEach(function (label) {
      meta.push(el('span', { class: 'badge badge-alert', text: label }));
    });
    if (isDup) meta.push(el('span', { class: 'badge badge-warn', text: '重複' }));
    meta.push(el('span', { class: 'muted', text: fmtDate(t.registeredAt) }));

    var card = el('button', {
      type: 'button',
      class: 'card' + (list.selectMode && picked ? ' card-on' : ''),
      onclick: function () {
        if (!list.selectMode) { openEdit(t); return; }
        var at = list.selected.indexOf(t.id);
        if (at >= 0) list.selected.splice(at, 1); else list.selected.push(t.id);
        render();
      },
    }, [
      list.selectMode ? el('span', { class: 'checkbox' + (picked ? ' checkbox-on' : '') }) : null,
      el('span', { class: 'card-thumb' }, [
        t.thumb ? el('img', { src: t.thumb, alt: '' }) : el('span', { class: 'no-photo', text: '写真なし' }),
      ]),
      el('span', { class: 'card-body' }, [
        el('span', { class: 'card-title', text: t.treeNo }),
        el('span', { class: 'card-species' }, [
          t.species || '',
          t.leafDensity ? el('span', { class: 'muted', text: '　葉 ' + leafDensityLabel(t.leafDensity) }) : null,
        ]),
        el('span', { class: 'card-meta' }, meta),
      ]),
    ]);
    return el('li', {}, [card]);
  })));
}

function handleBulkDelete() {
  var ids = state.list.selected.slice();
  if (!ids.length) return;
  if (!window.confirm('選択した ' + ids.length + ' 件を削除します。写真も消えます。よろしいですか？')) return;
  deleteTrees(ids).then(function () {
    state.list.selected = [];
    state.list.selectMode = false;
    showToast(ids.length + ' 件を削除しました');
    render();
  });
}
