function handleParkSave() {
  var st = state.settings;
  var code = st.parkForm.code.trim();
  var name = st.parkForm.name.trim();
  var selfId = st.parkEditing.id || null;

  if (!name) { st.parkError = '公園名を入れてください。'; render(); return; }
  if (!isValidParkCode(code)) {
    st.parkError = '公園コードは半角英数とハイフンだけが使えます。';
    render();
    return;
  }
  if (isParkCodeTaken(code, selfId)) {
    st.parkError = '公園コード ' + code + ' はすでに使われています。';
    render();
    return;
  }

  // 公園名の表記ゆれ照合（樹木台帳メモ由来）。
  // 「皇子が丘公園」と「皇子ヶ丘公園」のような二重登録を止める。
  var same = findParkByName(mem.parks, name, selfId);
  if (same) {
    st.parkError = '「' + same.name + '」（' + same.code + '）と同じ公園に見えます。' +
      '別名で登録するか、既存の公園を編集してください。';
    render();
    return;
  }
  if (!selfId) {
    var cands = parkCandidates(mem.parks, name);
    if (cands.length) {
      var ok = window.confirm('「' + name + '」は既存の公園と名前が似ています。\n' +
        '　近い公園: ' + cands.join(' / ') + '\n\n別の公園として新しく登録しますか？');
      if (!ok) return;
    }
  }

  var done = function (message) {
    st.parkEditing = null;
    st.parkError = '';
    showToast(message);
    render();
  };

  if (!selfId) {
    addPark({ code: code, name: name, note: st.parkForm.note }).then(function (park) {
      // 最初の1つ目なら、そのまま登録タブで使えるように選んでおく
      if (!state.currentParkId) {
        state.currentParkId = park.id;
        if (state.form) applyTapeSuggestion();
      }
      done(name + ' を登録しました');
    });
    return;
  }

  var renumber = false;
  if (st.parkEditing.code !== code) {
    var counts = countParkContents(selfId);
    if (counts.treeCount > 0) {
      renumber = window.confirm('公園コードを ' + st.parkEditing.code + ' → ' + code + ' に変えます。\n' +
        'この公園の樹木 ' + counts.treeCount + '件 の樹木番号も書き換えますか？\n\n' +
        'OK: 書き換える（例 ' + st.parkEditing.code + '0001 → ' + code + '0001）\n' +
        'キャンセル: 樹木番号はこのままにする');
    }
  }
  updatePark(selfId, { code: code, name: name, note: st.parkForm.note }, { renumber: renumber })
    .then(function () { done(name + ' を更新しました'); });
}

function handleParkDelete(park) {
  var counts = countParkContents(park.id);
  var ok = window.confirm('「' + park.name + '」をまるごと削除します。\n\n' +
    '　樹木 ' + counts.treeCount + '件 / 写真 ' + counts.photoCount + '枚 も一緒に消えます。\n' +
    'この操作は取り消せません。よろしいですか？');
  if (!ok) return;
  deleteParkCascade(park.id).then(function () {
    if (state.currentParkId === park.id) state.currentParkId = null;
    if (state.listParkId === park.id) state.listParkId = null;
    if (state.editingTree && state.editingTree.parkId === park.id) finishEdit();
    showToast(park.name + ' を削除しました');
    render();
  });
}

/** CSVから公園を一括登録する（樹木台帳メモと同じ形式のCSVを想定） */
function handleParkCsv(e) {
  var st = state.settings;
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  st.csvBusy = true;
  st.parkError = '';
  render();

  file.arrayBuffer().then(function (buf) {
    var parsed = parseParkCsv(decodeCsvBuffer(buf));
    if (!parsed.ok) {
      st.parkError = parsed.reason;
      return null;
    }
    var ok = window.confirm(file.name + ' から ' + parsed.rows.length + '件 の公園を読み取りました。\n' +
      'すでに登録済みの公園は飛ばします。公園コードは続きから自動で付けます。\n\n登録しますか？');
    if (!ok) return null;
    return importParks(parsed.rows).then(function (res) {
      showToast('公園を ' + res.added + '件 登録しました' +
        (res.skipped ? '（' + res.skipped + '件は登録済みのため飛ばしました）' : ''));
      if (res.skipped) {
        st.parkError = '登録済みだった公園（' + res.skipped + '件）: ' +
          res.skippedNames.slice(0, 5).join(' / ') + (res.skipped > 5 ? ' …' : '');
      }
      return res;
    });
  }).catch(function (err) {
    st.parkError = 'CSVを読み込めませんでした: ' + (err && err.message ? err.message : err);
  }).then(function () {
    st.csvBusy = false;
    render();
  });
}

// ------------------------------------------------------------------
// 樹種マスタの管理
// ------------------------------------------------------------------
function renderSpeciesManager() {
  var st = state.settings;
  var master = getSpeciesMaster();
  var usage = getSpeciesUsage();

  var input = el('input', {
    type: 'text', value: st.speciesText, placeholder: '樹種名を追加（例 クスノキ）',
    oninput: function (e) { st.speciesText = e.target.value; },
    onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); addSpecies(); } },
  });

  function addSpecies() {
    var name = st.speciesText.trim();
    if (!name) return;
    if (master.indexOf(name) >= 0) {
      showToast(name + ' はすでにあります');
      st.speciesText = '';
      render();
      return;
    }
    setSpeciesMaster(master.concat([name])).then(function () {
      st.speciesText = '';
      render();
    });
  }

  function move(index, delta) {
    var cur = getSpeciesMaster().slice();
    var to = index + delta;
    if (to < 0 || to >= cur.length) return;
    var tmp = cur[index];
    cur[index] = cur[to];
    cur[to] = tmp;
    setSpeciesMaster(cur).then(render);
  }

  function remove(name) {
    if (!window.confirm('樹種「' + name + '」をマスタから外します。\n登録済みの樹木の樹種はそのまま残ります。')) return;
    setSpeciesMaster(getSpeciesMaster().filter(function (n) { return n !== name; })).then(render);
  }

  var body = [
    el('h3', { class: 'block-title', text: '樹種マスタ' }),
    el('p', { class: 'hint', text:
      '登録タブのタイルは「使用回数の降順」で上位12件を出します。並び順は回数が同じときに効きます。' }),
    el('div', { class: 'link-row' }, [input, button('追加', 'btn btn-ghost', addSpecies)]),
  ];
  if (!master.length) body.push(el('p', { class: 'muted', text: 'まだ樹種がありません。' }));
  body.push(el('ul', { class: 'rows' }, master.map(function (name, i) {
    return el('li', { class: 'row' }, [
      el('span', { class: 'row-main' }, [
        el('strong', { text: name }),
        el('span', { class: 'muted', text: (usage[name] || 0) + ' 回' }),
      ]),
      el('span', { class: 'row-actions' }, [
        button('↑', 'btn btn-ghost', function () { move(i, -1); }, { disabled: i === 0 }),
        button('↓', 'btn btn-ghost', function () { move(i, 1); }, { disabled: i === master.length - 1 }),
        button('削除', 'btn btn-danger', function () { remove(name); }),
      ]),
    ]);
  })));

  return el('section', { class: 'block' }, body);
}

/**
 * 紙の調査票を「アプリの中で」開く重ね表示。
 * 別タブ（window.open）で開くと、ホーム画面から起動したiPhoneには戻るボタンが無く
 * アプリへ帰れないので、アプリの上に重ねて出し [✕ 閉じる] で戻す。
 */
function openSheetViewer(options) {
  var doc = el('div', { class: 'sheetdoc', html: buildSurveySheetFragment(options) });
  var viewerBody = el('div', { class: 'sheet-viewer-body' }, [doc]);
  var viewer = el('div', {
    class: 'sheet-viewer is-fit', role: 'dialog', 'aria-modal': 'true', 'aria-label': '紙の調査票',
  });

  var close = function () {
    window.removeEventListener('resize', measure);
    window.removeEventListener('keydown', onKey);
    document.body.classList.remove('sheet-open');
    viewer.remove();
  };
  var onKey = function (e) { if (e.key === 'Escape') close(); };

  var fitBtn = button('🔍 拡大', 'btn btn-ghost', function () {
    var fit = viewer.classList.toggle('is-fit');
    fitBtn.textContent = fit ? '🔍 拡大' : '⤢ 全体';
    fitBtn.setAttribute('aria-pressed', fit ? 'false' : 'true');
  });

  viewer.appendChild(el('div', { class: 'sheet-viewer-bar' }, [
    button('✕ 閉じる', 'btn btn-ghost', close),
    button('🖨 印刷する', 'btn btn-primary', function () { window.print(); }),
    fitBtn,
  ]));
  viewer.appendChild(viewerBody);
  viewer.appendChild(el('p', { class: 'sheet-viewer-hint' }, [
    '画面の見え方にかかわらず、印刷は', el('b', { text: 'A4・横' }), 'の原寸で出ます',
  ]));

  // アプリ本体（#root）の兄弟として body 直下に出す。
  // こうしておくと、印刷のときに #root だけを隠せる。
  document.body.appendChild(viewer);
  document.body.classList.add('sheet-open');

  // 画面幅にちょうど収まる倍率を決める。用紙の実寸（281mm＋余白）は変わらないので、
  // 縮める前に一度だけ測って覚えておく（縮めたあとに測り直すと合わなくなる）。
  // scrollWidth は右側の余白を数えない（右端が切れる）ので、用紙1枚の幅に
  // 外側の余白を足して実寸を出す。
  var naturalW = (function () {
    var sheet = doc.querySelector('.sheet');
    if (!sheet) return doc.scrollWidth;
    var pad = window.getComputedStyle(doc);
    return sheet.getBoundingClientRect().width +
      (parseFloat(pad.paddingLeft) || 0) + (parseFloat(pad.paddingRight) || 0);
  })();
  function measure() {
    if (!naturalW) return;
    viewer.style.setProperty('--sheet-zoom', String(Math.min(1, viewerBody.clientWidth / naturalW)));
  }
  measure();
  window.addEventListener('resize', measure);
  window.addEventListener('keydown', onKey);
}

/** 保存してあるものを全部そろえる（フルバックアップ用） */
function loadAll() {
  return getAllPhotos().then(function (photos) {
    return {
      parks: mem.parks,
      trees: mem.trees,
      photos: photos,
      // 本体（Dexie）と同じ形（[{key,value},…]）にそろえて書き出す
      settings: Object.keys(mem.settings).map(function (key) {
        return { key: key, value: mem.settings[key] };
      }),
    };
  });
}

function daysSince(iso) {
  if (!iso) return null;
  var ms = Date.now() - new Date(iso).getTime();
  return Number.isNaN(ms) ? null : Math.floor(ms / 86400000);
}

function parkNameMap() {
  var map = {};
  mem.parks.forEach(function (p) { map[p.id] = p.name; });
  return map;
}

function renderBackupPanel() {
  var st = state.settings;

  // ストレージ使用量は非同期でしか取れないので、1回だけ取りに行って画面を作り直す
  if (st.storage === null && !st.storageAsked) {
    st.storageAsked = true;
    estimateStorage().then(function (res) {
      st.storage = res || false;
      if (state.tab === 'settings') render();
    });
  }

  var importInput = el('input', {
    type: 'file', accept: '.json,application/json', hidden: true,
    onchange: function (e) { handleImportJson(e); },
  });

  var d = daysSince(getSetting('lastBackupAt', null));

  var body = [
    el('h3', { class: 'block-title', text: 'バックアップ・書き出し' }),
    el('p', {
      class: d !== null && d >= 7 ? 'status status-error' : 'hint',
      text: d === null ? 'まだバックアップを取っていません。' : '最終バックアップから ' + d + ' 日',
    }),
    el('div', { class: 'btn-grid' }, [
      button('JSON 写真あり', 'btn btn-primary', exportFullJson),
      button('JSON 写真なし', 'btn', exportLightJson),
      button('CSV', 'btn', exportCsv),
      button('CSV 凡例', 'btn', function () {
        downloadFile('kantantree-凡例-' + fileStamp() + '.csv', buildLegendCsv(), 'text/csv;charset=utf-8');
        showToast('凡例CSVを書き出しました');
      }),
    ]),
    el('p', { class: 'hint', text:
      '「写真あり」が端末を移すときのフルバックアップ。「写真なし」は他のアプリ（本体のReact版を含む）への受け渡し用。' +
      'CSVはExcel（UTF-8 BOM付き）。「CSV 凡例」は 1〜4 の段階の意味をまとめた別ファイルです。' }),
    importInput,
    el('div', { class: 'btn-row' }, [
      button('JSONを読み込む（追記マージ）', 'btn btn-wrap', function () { importInput.click(); }),
    ]),
    el('p', { class: 'hint', text:
      '読み込みは「追記マージ」です。同じ id は更新日時の新しい方を採用し、知らない id は追加します。' +
      '本体（React版）で書き出したJSONもそのまま読み込めます。' }),
    el('p', { class: 'hint', text: 'ストレージ使用量: ' + (st.storage
      ? '約 ' + formatBytes(st.storage.usage) + (st.storage.quota ? ' / ' + formatBytes(st.storage.quota) : '')
      : 'この端末では取得できません') }),
  ];

  return el('section', { class: 'block' }, body);
}

function exportFullJson() {

      showToast('フルバックアップを書き出しました（樹木 ' + all.trees.length + '件 / 写真 ' + all.photos.length + '枚）');
      render();

function exportLightJson() {

    JSON.stringify(buildLightBackup({ parks: mem.parks, trees: mem.trees })), 'application/json');
  showToast('軽量JSONを書き出しました（樹木 ' + mem.trees.length + '件）');
}

function exportCsv() {
  downloadFile('kantantree-' + fileStamp() + '.csv', buildCsv(mem.trees, parkNameMap()), 'text/csv;charset=utf-8');
  showToast('CSVを書き出しました（' + mem.trees.length + '件）');
}

/** JSONの読み込み（追記マージ。全上書きではない） */
function handleImportJson(e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;

  file.text().then(function (text) {
    var data = JSON.parse(text);
    var invalid = validateBackup(data);
    if (invalid) { showToast(invalid); return null; }

    var plan = planMerge({ parks: mem.parks, trees: mem.trees }, data);
    var ok = window.confirm('このファイルを追記マージします（全上書きではありません）。\n\n' +
      '　公園: 追加 ' + plan.parks.add.length + '件 / 更新 ' + plan.parks.update.length + '件\n' +
      '　樹木: 追加 ' + plan.trees.add.length + '件 / 更新 ' + plan.trees.update.length + '件\n' +
      '　変更なし（取込側が古い）: ' + plan.skipped + '件\n\n実行しますか？');
    if (!ok) return null;

    var parkPuts = plan.parks.add.concat(plan.parks.update);
    var treePuts = plan.trees.add.concat(plan.trees.update);
    var treeIds = treePuts.map(function (t) { return t.id; });
    // 写真は「取込側に写真が入っている樹木」だけ入れ替える
    var incomingPhotos = (data.photos || []).filter(function (p) { return treeIds.indexOf(p.treeId) >= 0; });
    var photoTreeIds = [];
    incomingPhotos.forEach(function (p) {
      if (photoTreeIds.indexOf(p.treeId) < 0) photoTreeIds.push(p.treeId);
    });

    // メモリ側を先に更新する（画面はメモリを見ているため）
    parkPuts.forEach(function (rec) {
      var at = mem.parks.findIndex(function (x) { return x.id === rec.id; });
      if (at >= 0) mem.parks[at] = rec; else mem.parks.push(rec);
    });
    treePuts.forEach(function (rec) {
      var at = mem.trees.findIndex(function (x) { return x.id === rec.id; });
      if (at >= 0) mem.trees[at] = rec; else mem.trees.push(rec);
    });
    if (store.mode === 'memory' && photoTreeIds.length) {
      mem.photos = mem.photos || {};
      photoTreeIds.forEach(function (id) { mem.photos[id] = []; });
      incomingPhotos.forEach(function (p) { mem.photos[p.treeId].push(p); });
    }

    // 樹種マスタは足し合わせる（消さない）
    var incomingMaster = [];
    (data.settings || []).forEach(function (s) {
      if (s && s.key === 'speciesMaster' && Array.isArray(s.value)) incomingMaster = s.value;
    });
    var settingsPuts = [];
    if (incomingMaster.length) {
      var merged = getSpeciesMaster().slice();
      incomingMaster.forEach(function (name) { if (merged.indexOf(name) < 0) merged.push(name); });
      mem.settings.speciesMaster = merged;
      settingsPuts.push({ key: 'speciesMaster', value: merged });
    }

    var ops = {};
    if (parkPuts.length) ops.parks = { put: parkPuts };
    if (treePuts.length) ops.trees = { put: treePuts };
    if (photoTreeIds.length) ops.photos = { delByTree: photoTreeIds, put: incomingPhotos };
    if (settingsPuts.length) ops.settings = { put: settingsPuts };

    return persist(ops).then(function () {
      showToast('取込みました（公園 +' + plan.parks.add.length + '/更新' + plan.parks.update.length +
        '、樹木 +' + plan.trees.add.length + '/更新' + plan.trees.update.length + '）');
      state.settings.storage = null;
      state.settings.storageAsked = false;
      render();
    });
  }).catch(function (err) {
    showToast('取込に失敗しました: ' + (err && err.message ? err.message : err));
  });
}

/* ==================================================================
   §12 起動（本体 src/App.jsx / main.jsx）
   ================================================================== */

function boot() {
  rootEl.appendChild(el('div', { class: 'app' }, [
    el('header', { class: 'appbar' }),
    el('main', { class: 'main' }, [el('p', { class: 'muted pad', text: '読み込み中…' })]),
    el('footer', { class: 'copyright', text: '© 2026 Koh Kitsukawa. All rights reserved.' }),
    el('nav', { class: 'tabbar' }),
  ]));
  mainEl = rootEl.querySelector('.main');

  openStore().then(function () {
    // 起動時: 最後に使った公園を選んでおく
    var recent = sortedParks()[0];
    if (recent) {
      state.currentParkId = recent.id;
      state.listParkId = recent.id;
    }
    // 紙の調査票の初期値も、前回の調査情報にそろえる
    var last = getSetting('lastSurvey', null);
    if (last) {
      state.settings.sheet.surveyDate = last.surveyDate || '';
      state.settings.sheet.surveyor = last.surveyor || '';
      state.settings.sheet.tapeRoll = last.tapeRoll || '';
    }
    initForm();
    render();
    if (store.mode !== 'idb') showToast('保存先について、設定タブに注意書きがあります');
  }).catch(function (err) {
    mainEl.textContent = '';
    mainEl.appendChild(el('p', { class: 'status status-error pad',
      text: '起動できませんでした: ' + (err && err.message ? err.message : err) }));
  });
}

boot();

})();
